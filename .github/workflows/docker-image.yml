name: Build Media Converter

on:
  push:
    branches: [ "main" ] 
  pull_request:          # Build (but don't push) every PR so Dockerfile changes are verified
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # We just added 'latest' to this array!
        hardware: [cpu, intel, amd, latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Passes 'latest' (or cpu/intel/amd) into the Dockerfile
          build-args: |
            HW_TYPE=${{ matrix.hardware }}
          # Automatically creates the :latest tag!
          tags: ghcr.io/blhackslash/media-converter:${{ matrix.hardware }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker build -q --build-arg HW_TYPE=${{ matrix.hardware }} -t mc-test .
          mkdir -p in out
          docker run --rm -v "$PWD/in:/data/input" mc-test ffmpeg -loglevel error -f lavfi -i testsrc=size=320x240 -frames:v 1 "/data/input/test image.jpg"
          docker run --rm -v "$PWD/in:/data/input" mc-test ffmpeg -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -t 2 -c:v mpeg4 "/data/input/test clip.mov"
          docker run --rm -e HW_ACCEL=false -v "$PWD/in:/data/input:ro" -v "$PWD/out:/data/output" mc-test | tee run.log
          grep -q "Pipeline Finished Successfully" run.log
          ! grep -E "\[(FAIL|ERROR)\]|: (FAIL|ERROR)" run.log
