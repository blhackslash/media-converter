services:
  media-pipeline:
    image: localhost/media-converter:latest  # Or choose :intel, :amd, :cpu
    container_name: media-converter
    devices:
      - /dev/dri:/dev/dri  # Pass the GPU device for acceleration
    volumes:
      - ./input:/data/input:ro  # Recursive source folder (never written to)
      - ./output:/data/output   # Recursive destination folder
    environment:
      - HW_ACCEL=true             # Enable hardware acceleration (default)
      - VIDEO_CODEC=hevc          # Set default video codec (hevc or av1)
      - VIDEO_QUALITY=28          # Integer quality level (lower is better, default 28)
      - IMAGE_FORMAT=heic         # Set default image format (heic or avif)
      - IMAGE_QUALITY=70          # Integer image quality (0-100, default 60)
    # Optional: run as your own user so output files are not owned by root.
    # See "Running as a Non-Root User" in the README for the GPU group IDs.
    # user: "1000:1000"
    # group_add: ["44", "104"]
    # The pipeline runs once and then exits. Set a restart policy if you want it to trigger again on changes.
    # restart: unless-stopped
